[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webdamga"
version = "0.1.0"
description = "Yerel web kanıt/arşiv aracı — bir URL'nin belirli bir andaki halini ekran görüntüsü, HTML, ağ trafiği ve SHA-256 bütünlük manifestosuyla kayıt altına alır."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["web-archiving", "forensics", "screenshot", "phishing", "evidence", "playwright", "urlscan", "har", "mhtml"]
authors = [{ name = "webdamga contributors" }]
dependencies = [
    "playwright>=1.47",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
webdamga = "webdamga.cli:main"

[project.urls]
Homepage = "https://github.com/gorkemguler/webdamga"
Issues = "https://github.com/gorkemguler/webdamga/issues"

[tool.hatch.build.targets.wheel]
packages = ["webdamga"]

[tool.hatch.build.targets.wheel.force-include]
"webdamga/web" = "webdamga/web"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
