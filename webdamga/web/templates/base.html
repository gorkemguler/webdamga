<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}webdamga{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">web<span>damga</span></a>
    <span class="tag">{{ _('web.tagline') }} &middot; v{{ version }}</span>
    <nav class="langs">
      {% for code in langs %}
        <a href="?lang={{ code }}"
           class="lang{{ ' on' if code == lang }}"
           {% if code == lang %}aria-current="true"{% endif %}>{{ code|upper }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
